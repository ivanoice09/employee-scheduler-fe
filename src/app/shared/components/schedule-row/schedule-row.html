<div class="employee-cell">
  <span>{{ assignment().controls.employeeName.value }}</span>
</div>

@for (
shift of assignment().controls.shifts.controls;
track $index;
let dayIndex = $index
) {
<div class="shift-cell">
  @if (viewMode() === 'edit') {
  <div [formGroup]="shift" class="shift-editor">
    <div class="time-group" data-time-field="startHour">
      <app-time-picker [pickerId]="employeeIndex() + '-' + dayIndex + '-startHour'" type="hour"
        [popupOnTop]="popupOnTop()" formControlName="startHour" (focusin)="onTimeFocusIn($event, shift, dayIndex, 'startHour')"
        (focusout)="onTimeFocusOut($event, shift, dayIndex, 'startHour')" />

      <div class="minute-group" data-time-field="startMinute"
        [class.minute-group--hidden]="!isMinuteVisible(shift, dayIndex, 'startMinute')">
        <span>:</span>

        <app-time-picker [pickerId]="employeeIndex() + '-' + dayIndex + '-startMinute'" type="minute"
          [popupOnTop]="popupOnTop()" formControlName="startMinute"
          (focusin)="onTimeFocusIn($event, shift, dayIndex, 'startMinute')"
          (focusout)="onTimeFocusOut($event, shift, dayIndex, 'startMinute')" />
      </div>
    </div>

    <span>-</span>

    <div class="time-group" data-time-field="endHour">
      <app-time-picker [pickerId]="employeeIndex() + '-' + dayIndex + '-endHour'" type="hour"
        [popupOnTop]="popupOnTop()" formControlName="endHour" (focusin)="onTimeFocusIn($event, shift, dayIndex, 'endHour')"
        (focusout)="onTimeFocusOut($event, shift, dayIndex, 'endHour')" />

      <div class="minute-group" data-time-field="endMinute"
        [class.minute-group--hidden]="!isMinuteVisible(shift, dayIndex, 'endMinute')">
        <span>:</span>

        <app-time-picker [pickerId]="employeeIndex() + '-' + dayIndex + '-endMinute'" type="minute"
          [popupOnTop]="popupOnTop()" formControlName="endMinute"
          (focusin)="onTimeFocusIn($event, shift, dayIndex, 'endMinute')"
          (focusout)="onTimeFocusOut($event, shift, dayIndex, 'endMinute')" />
      </div>
    </div>
  </div>
  } @else {
  <span class="shift-text">
    {{ shift | shiftText }}
  </span>
  }
</div>
}
